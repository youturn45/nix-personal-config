name: Check Nix configurations

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: Evaluate ${{ matrix.host }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        host: [Rorschach, NightOwl, SilkSpectre]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Python for shared validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # NightOwl also evaluates the generated projection and runs ALL three strict
      # suites (_tests, scripts/_tests, modules/darwin/mihomo/_tests), with no skips.
      - name: Install just for recovery command-spy tests
        if: matrix.host == 'NightOwl'
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Shared no-build validation (strict regression suites on NightOwl)
        run: python3 scripts/validate.py --host '${{ matrix.host }}'

  nixos:
    name: Evaluate NixOS and installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Python for shared validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shared no-build validation (Linux toplevel and installer ISO)
        run: python3 scripts/validate.py --platform linux

      # Separate from evaluation: nix fmt can realize the formatter package.
      - name: Check Nix formatting
        run: nix fmt --no-write-lock-file -- --check .
